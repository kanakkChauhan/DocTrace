[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kanak Chauhan", email = "kanakkchauhan08@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.2",
    "requests>=2.34.2",
]


[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.ruff.lint.per-file-ignores]
"src/backend/api/**/*.py" = ["B008"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true